      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="640" fill="url(#bg)"/>

  <!-- логотип-марка слева -->
